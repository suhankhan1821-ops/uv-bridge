name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore stable signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.UV_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Missing UV_KEYSTORE_BASE64 secret"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > app/uv-bridge-debug.keystore
          test -s app/uv-bridge-debug.keystore

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        env:
          UV_KEYSTORE_PASSWORD: ${{ secrets.UV_KEYSTORE_PASSWORD }}
          UV_KEY_ALIAS: ${{ secrets.UV_KEY_ALIAS }}
          UV_KEY_PASSWORD: ${{ secrets.UV_KEY_PASSWORD }}
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: uv-bridge-apk
          path: app/build/outputs/apk/debug/app-debug.apk
